[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circumbinary-triples"
version = "0.1.0"
description = "Stabilité dynamique et habitabilité de planètes circumbinaires dans les systèmes stellaires triples hiérarchiques"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    contourpy==1.4.0
    cycler==0.12.1
    fonttools==4.67.0
    kiwisolver==1.5.1
    matplotlib==3.11.2
    numpy==2.5.4
    packaging==26.3
    pandas==3.0.6
    pillow==12.3.0
    pyparsing==3.3.3
    python-dateutil==2.9.0.post0
    rebound==5.2.2
    six==1.17.0
]
