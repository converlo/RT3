[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circumbinary_triples"
version = "0.1.0"
description = "Stabilité dynamique et habitabilité de planètes circumbinaires dans les systèmes stellaires triples hiérarchiques"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "rebound>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/circumbinary_triples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests longs (intégrations N corps)"]